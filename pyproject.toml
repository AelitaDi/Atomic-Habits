[tool.poetry]
name = "atomic-habits"
version = "0.1.0"
description = ""
authors = ["uliana rogova <uv.rogova@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.6"
djangorestframework = "^3.15.2"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.10"
django-filter = "^25.1"
djangorestframework-simplejwt = "^5.4.0"
coverage = "^7.6.12"
drf-yasg = "^1.21.8"
celery = "^5.4.0"
redis = "^5.2.1"
eventlet = "^0.39.0"
django-celery-beat = "^2.7.0"
pillow = "^11.1.0"
requests = "^2.32.3"
django-cors-headers = "^4.7.0"
gunicorn = "^23.0.0"
django-redis = "^5.4.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.2"
isort = "^6.0.0"
black = "^25.1.0"

[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
